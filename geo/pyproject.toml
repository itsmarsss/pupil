[project]
name = "geo"
version = "0.1.0"
description = "Model-based gaze estimation on macOS"
readme = "README.md"
authors = [
    { name = "itsmarsss", email = "88464166+itsmarsss@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "hidapi>=0.15.0",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-contrib-python-headless>=4.10,<5",
    "pyobjc-framework-avfoundation>=12.2.2",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "rerun-sdk>=0.40.0",
]

[tool.uv]
# mediapipe pulls in the GUI build of OpenCV, which bundles its own SDL2 and clashes with pygame's
# ("Class SDLApplication is implemented in both ..."). Use the headless build instead: same cv2 module, no GUI.
override-dependencies = ["opencv-contrib-python ; sys_platform == 'never'"]
