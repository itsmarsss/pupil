[project]
name = "gaze"
version = "0.1.0"
description = "Webcam gaze tracking for macOS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==0.10.21",
    "MNN>=3.0",
    "numpy>=1.26,<2",
    "opencv-contrib-python>=4.9,<5",
    "pyobjc-core>=11",
    "pyobjc-framework-Cocoa>=11",
    "pyobjc-framework-Quartz>=11",
    "pyobjc-framework-AVFoundation>=11",
    "pyobjc-framework-ApplicationServices>=11",
]

[project.scripts]
gaze = "gaze.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
