[project]
name = "pupil"
version = "0.1.0"
description = "Pupil: webcam gaze tracking and voice control for macOS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe>=1.1.1",
    "MNN>=3.0",
    "numpy>=2",
    "opencv-contrib-python>=4.9,<5",
    "pyobjc-core>=11",
    "pyobjc-framework-Cocoa>=11",
    "pyobjc-framework-Quartz>=11",
    "pyobjc-framework-AVFoundation>=11",
    "pyobjc-framework-ApplicationServices>=11",
    "websockets>=13",
]

[project.optional-dependencies]
# `pupil control`: voice + gaze computer control (Jev fast tier, Claude agent)
control = [
    "anthropic>=2.3",
    "typesafe-sdk>=0.7.5",
    "Pillow>=10",
    "pyautogui>=0.9.54",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
    "certifi",  # Cartesia streaming speech-to-text (websockets is already a core dependency)
]

[project.scripts]
pupil = "pupil.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pupil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
