[project]
name = "gaze"
version = "0.1.0"
description = "Webcam gaze tracking for macOS"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe>=1.1.1",
    "MNN>=3.0",
    "numpy>=2",
    "opencv-contrib-python>=4.9,<5",
    "pyobjc-core>=11",
    "pyobjc-framework-Cocoa>=11",
    "pyobjc-framework-Quartz>=11",
    "pyobjc-framework-AVFoundation>=11",
    "pyobjc-framework-ApplicationServices>=11",
]

[project.optional-dependencies]
# `gaze control`: voice + gaze computer control (Jev fast tier, Claude agent)
control = [
    "anthropic>=2.3",
    "typesafe-sdk>=0.7.5",
    "PyQt6>=6.7",
    "mss>=9",
    "Pillow>=10",
    "pyautogui>=0.9.54",
    "sounddevice>=0.5",
    "faster-whisper>=1.1",
]

[project.scripts]
gaze = "gaze.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
